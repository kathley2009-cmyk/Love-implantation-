<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Rashi ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#fff;background:linear-gradient(135deg,#160016,#52003f,#180018);overflow-x:hidden}
main{max-width:900px;margin:auto;padding:28px 16px 60px;position:relative;z-index:1}.hero{text-align:center;padding:55px 10px 30px}
h1{font-size:clamp(44px,10vw,82px);margin:0;color:#ffd6ec;text-shadow:0 0 24px #ff4fa3}.hero p{font-size:19px;line-height:1.7;color:#ffe8f4}
button{border:0;border-radius:30px;padding:13px 22px;margin:6px;background:#ff4fa3;color:#fff;font-size:16px}
.chapter{margin:22px 0;padding:26px;border:1px solid #ffffff24;border-radius:24px;background:#ffffff12;box-shadow:0 14px 35px #0005;backdrop-filter:blur(7px)}
.chapter h2{color:#ffd0e8}.chapter p{line-height:1.85;font-size:17px;color:#fff0f7}
#surprise{display:none;margin:22px 0;padding:22px;border-radius:20px;background:#ff4fa322;text-align:center}.counter{text-align:center;color:#ffc4df}
.heart{position:fixed;bottom:-30px;z-index:0;animation:up 7s linear forwards;pointer-events:none}@keyframes up{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
footer{text-align:center;padding:30px;color:#ffd0e8}
</style>
</head>
<body>
<main>
<section class="hero"><h1>For Rashi ❤️</h1><p>200 little chapters for one very special person 💗</p>
<button onclick="surprise()">Open Your Surprise ✨</button><div id="surprise"><h2>Rashuuu 💕</h2><p>No single page could ever contain every memory, every laugh and every little reason you are special. So this page keeps turning one chapter at a time.</p></div></section>
<div class="counter">200 Chapters • Made with love ❤️</div>
<div id="chapters"></div>
<footer>Always keep smiling, Rashi 💗</footer>
</main>
<script>
const ideas=["your smile","your kindness","your adorable little moments","our conversations","the memories we keep making","the laughter you bring","the way ordinary moments feel special","the little things that make you unique","the happiness you deserve","the memories still waiting for us"];
const box=document.getElementById("chapters");
for(let i=1;i<=200;i++){
 let x=ideas[(i-1)%ideas.length];
 box.insertAdjacentHTML("beforeend",`<section class="chapter"><h2>Chapter ${i} — ${x} 💗</h2><p>Some people become important because of one huge moment, but you are special because of hundreds of tiny moments. Chapter ${i} is another reminder to appreciate ${x}. The smallest memories can become the ones we remember for years.</p><p>Whatever the day looks like, there is always something worth smiling about. This chapter is one small piece of a much bigger collection of memories, conversations, laughs and moments that make this story meaningful.</p></section>`);
}
function surprise(){document.getElementById("surprise").style.display="block";for(let i=0;i<20;i++)setTimeout(heart,i*80)}
function heart(){let h=document.createElement("span");h.className="heart";h.textContent=["❤️","💗","💕","💖","💞"][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+"%";h.style.fontSize=18+Math.random()*20+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),7000)}
setInterval(heart,650);
</script>
</body>
</html>
