<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; justify-content:center; align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
}
.card{
  width:min(90%,420px); padding:35px 22px; text-align:center;
  border-radius:28px; background:rgba(255,255,255,.22);
  backdrop-filter:blur(12px);
  box-shadow:0 15px 45px rgba(0,0,0,.18);
  color:#fff; z-index:2;
}
h1{font-size:38px;margin:0 0 12px;text-shadow:0 3px 12px #c45}
p{font-size:18px;line-height:1.5}
button{
  border:0; border-radius:999px; padding:13px 25px;
  font-size:16px; font-weight:bold; cursor:pointer;
  background:#fff; color:#e75480;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}
#message{display:none;margin-top:20px;font-size:24px;font-weight:bold}
.heart{
  position:fixed; bottom:-30px; font-size:24px;
  animation:float 6s linear forwards; pointer-events:none;
}
@keyframes float{
  0%{transform:translateY(0) scale(.7);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg) scale(1.3);opacity:0}
}
.love{
  margin-top:20px; height:100px; overflow:hidden;
  font-weight:bold; font-size:16px; line-height:1.7;
}
</style>
</head>
<body>

<div class="card">
  <h1>Hey Cutuu 💗</h1>
  <p>I made something tiny just for you...</p>
  <button onclick="showLove()">Open Your Surprise 💌</button>

  <div id="message">I LOVE YOU CUTU ❤️</div>

  <div class="love" id="loveBox"></div>
</div>

<script>
const box=document.getElementById("loveBox");

function showLove(){
  document.getElementById("message").style.display="block";
  for(let i=0;i<100;i++){
    const text=document.createElement("div");
    text.textContent="I LOVE YOU CUTU ❤️";
    box.appendChild(text);
  }
  burst();
}

function burst(){
  for(let i=0;i<25;i++){
    setTimeout(()=>{
      const h=document.createElement("div");
      h.className="heart";
      h.textContent=["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];
      h.style.left=Math.random()*100+"vw";
      h.style.animationDuration=(4+Math.random()*4)+"s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),8000);
    },i*100);
  }
}
</script>

</body>
</html>
