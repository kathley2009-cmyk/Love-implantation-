<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Cutuu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ffb6c9 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #d9a7ff 0%, transparent 30%),
        linear-gradient(135deg,#ff758c,#ff7eb3,#c77dff);
}

/* glowing background */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle,rgba(255,255,255,.18) 1px,transparent 1px);
    background-size:25px 25px;
    animation:bgMove 12s linear infinite;
    pointer-events:none;
}

@keyframes bgMove{
    from{transform:translate(0,0)}
    to{transform:translate(25px,25px)}
}

/* Main card */
.card{
    width:90%;
    max-width:430px;
    padding:35px 22px;
    text-align:center;
    color:white;

    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    border-radius:30px;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.3);

    z-index:10;
    animation:cardIn 1.2s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.8) translateY(30px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

h1{
    font-size:38px;
    margin-bottom:10px;
    text-shadow:0 5px 20px rgba(120,0,50,.5);
}

.subtitle{
    font-size:17px;
    opacity:.95;
    margin-bottom:25px;
}

/* Button */
button{
    border:none;
    outline:none;
    padding:15px 27px;

    border-radius:50px;

    font-size:16px;
    font-weight:bold;
    color:#e94b83;
    background:white;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,.2);

    transition:.25s;
}

button:hover{
    transform:scale(1.07);
}

button:active{
    transform:scale(.94);
}

/* Main message */
#message{
    display:none;
    margin-top:25px;

    font-size:28px;
    font-weight:bold;

    animation:pop .8s ease;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ffb6d5,
        0 0 45px #ff4f9a;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:scale(.3);
    }
    70%{
        transform:scale(1.15);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* Endless I LOVE YOU area */
.loveBox{
    display:none;

    margin-top:22px;

    height:130px;
    overflow:hidden;

    border-radius:20px;

    background:rgba(255,255,255,.10);

    position:relative;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.08);
}

.loveTrack{
    position:absolute;
    width:100%;
    top:0;
    left:0;

    animation:scrollLove 18s linear infinite;
}

.loveLine{
    height:24px;
    line-height:24px;

    font-size:15px;
    font-weight:bold;

    color:white;

    text-shadow:
        0 0 8px rgba(255,255,255,.9);
}

@keyframes scrollLove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-50%);
    }
}

/* Floating hearts */
.heart{
    position:fixed;

    bottom:-40px;

    pointer-events:none;

    z-index:5;

    animation:heartFloat linear forwards;
}

@keyframes heartFloat{

    0%{
        transform:
            translateY(0)
            scale(.5)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:
            translateY(-50vh)
            scale(1)
            rotate(180deg);
    }

    100%{
        transform:
            translateY(-115vh)
            scale(1.4)
            rotate(360deg);

        opacity:0;
    }
}

/* Sparkles */
.sparkle{
    position:fixed;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px white,
        0 0 20px #fff;

    pointer-events:none;

    animation:sparkleAnim 2s ease-out forwards;
}

@keyframes sparkleAnim{
    0%{
        opacity:0;
        transform:scale(0);
    }

    30%{
        opacity:1;
        transform:scale(1.5);
    }

    100%{
        opacity:0;
        transform:scale(0);
    }
}

/* Bottom text */
.smallText{
    display:none;

    margin-top:18px;

    font-size:13px;
    opacity:.8;

    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:.8}
}

/* Mobile */
@media(max-width:480px){

    .card{
        padding:30px 18px;
    }

    h1{
        font-size:34px;
    }

    #message{
        font-size:24px;
    }
}
</style>
</head>


<body>

<div class="card">

    <h1>Hey Cutuu 💗</h1>

    <div class="subtitle">
        I made a little surprise just for you... 🥹
    </div>

    <button onclick="showLove()">
        Open Your Surprise 💌
    </button>

    <div id="message">
        I LOVE YOU CUTU ❤️
    </div>

    <div class="loveBox" id="loveBox">
        <div class="loveTrack" id="loveTrack"></div>
    </div>

    <div class="smallText" id="smallText">
        And I could keep saying it forever... ♾️❤️
    </div>

</div>


<script>

/* =========================
   LOVE MESSAGE
========================= */

function showLove(){

    const message =
        document.getElementById("message");

    const box =
        document.getElementById("loveBox");

    const small =
        document.getElementById("smallText");

    const track =
        document.getElementById("loveTrack");


    message.style.display = "block";

    box.style.display = "block";

    small.style.display = "block";


    /*
       We DON'T create 10,000,000 elements.

       Instead we create a small batch
       and continuously animate it.
    */

    if(!track.dataset.loaded){

        track.dataset.loaded = "true";

        let text = "";

        for(let i = 0; i < 120; i++){

            text +=
                '<div class="loveLine">' +
                'I LOVE YOU CUTU ❤️' +
                '</div>';

        }

        /*
           Duplicate the batch so the
           scrolling loop looks continuous.
        */

        track.innerHTML =
            text + text;

    }


    /* Hearts */

    createHearts(45);


    /* Sparkles */

    createSparkles(35);


    /* Button changes */

    document.querySelector("button").innerHTML =
        "I LOVE YOU TOO CUTU ❤️";


}


/* =========================
   FLOATING HEARTS
========================= */

function createHearts(amount){

    for(let i = 0; i < amount; i++){

        setTimeout(function(){

            const heart =
                document.createElement("div");

            heart.className = "heart";


            const hearts = [
                "❤️",
                "💗",
                "💕",
                "💖",
                "💘",
                "💓",
                "💞",
                "💝"
            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (18 + Math.random() * 25) + "px";


            heart.style.animationDuration =
                (5 + Math.random() * 5) + "s";


            document.body.appendChild(heart);


            setTimeout(function(){

                heart.remove();

            },10000);


        },i * 80);

    }

}


/* =========================
   SPARKLES
========================= */

function createSparkles(amount){

    for(let i = 0; i < amount; i++){

        setTimeout(function(){

            const sparkle =
                document.createElement("div");

            sparkle.className =
                "sparkle";


            sparkle.style.left =
                Math.random() * 100 + "vw";


            sparkle.style.top =
                Math.random() * 100 + "vh";


            document.body.appendChild(
                sparkle
            );


            setTimeout(function(){

                sparkle.remove();

            },2000);


        },i * 70);

    }

}


/* =========================
   BACKGROUND HEARTS
   CONTINUOUSLY
========================= */

setInterval(function(){

    const heart =
        document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "♡";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (7 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(function(){

        heart.remove();

    },12000);

},700);

</script>

</body>
</html>
